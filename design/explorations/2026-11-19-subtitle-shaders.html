<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Субтитры с шейдерами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
:root { color-scheme: dark; --base: #0B0C10; --card: #1C1E24; --line: #23262E; --ink: #EEF1F6; --ink-2: #A7ABB3; --ink-3: #8E939C;
  --words: "Onest", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--base); color: var(--ink); font: 15px/1.55 var(--words); }
.page { max-width: 1240px; margin: 0 auto; padding: 56px 24px 96px; }
h1 { font: 600 34px/1.15 var(--words); margin: 0 0 12px; }
h3 { font: 600 17px/1.3 var(--words); margin: 14px 0 4px; }
p { margin: 0 0 10px; max-width: 74ch; color: var(--ink-2); }
.eyebrow { font: 500 12px/1 var(--words); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 24px; margin-top: 32px; }
canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; background: #0d1420; }
.fx { color: var(--ink-3); font-size: 13px; }
.font { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--card); color: var(--ink-2); margin-left: 6px; vertical-align: 2px; }
.err { color: #ff8a8a; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">Moonbow · субтитры с шейдерами</div>
  <h1>Субтитры с шейдерами</h1>
  <p>Каждый стиль здесь — фрагментный шейдер: текст рисуется в отдельный слой, а шейдер искажает, размывает, расслаивает и подсвечивает его поверх кадра 60 раз в секунду. Реплика появляется заново каждые 6 секунд. Шрифты взяты с этого компьютера.</p>
  <div class="grid" id="grid"></div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 p; varying vec2 uv;
void main() { uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0., 1.); }
</script>

<script>
// Shared GLSL: noise, a blurred text sample, the background.
var COMMON = [
"precision highp float;",
"varying vec2 uv; uniform sampler2D bg, tx; uniform float t, k; uniform vec2 res;",
"float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
"float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);",
"  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }",
"float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a * n(p); p *= 2.03; a *= .5; } return s; }",
"float T(vec2 q) { return texture2D(tx, q).a; }",
"vec3 B(vec2 q) { return texture2D(bg, q).rgb; }",
// A soft glow of the text: 24 taps on two rings.
"float G(vec2 q, float r) { float s = 0.; for (int i = 0; i < 12; i++) { float a = float(i) * .5236;",
"  vec2 d = vec2(cos(a), sin(a) * res.x / res.y); s += T(q + d * r) + T(q + d * r * .45); } return s / 24.; }",
// Entrance progress, 0 to 1 over the first second of each 6-second loop.
"float E() { return clamp(k, 0., 1.); }",
""].join("\n");

var STYLES = [
{
  name: "VHS", font: "Golos", note: "Первый референс, только сильнее: строки плывут по дорожке ленты, цвета расслаиваются, бегущая полоса «трекинга», зерно, строки развёртки и синий ореол. Появляется со вспышкой помех.",
  type: "400 30px Golos", spacing: 4, color: "#F4F6FF", y: .86,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  float band = smoothstep(.06, 0., abs(fract(q.y * .8 - t * .09) - .5) - .42);",
  "  float wob = (n(vec2(q.y * 90., t * 7.)) - .5) * .0022 + sin(q.y * 420. + t * 30.) * .0005;",
  "  wob += band * (n(vec2(q.y * 300., t * 40.)) - .5) * .012 + (1. - e) * (n(vec2(q.y * 60., t * 50.)) - .5) * .05;",
  "  vec2 o = vec2(wob, 0.);",
  "  float sp = .0018 + (1. - e) * .008;",
  "  float r = T(q + o + vec2(sp, 0.)), g = T(q + o), b = T(q + o - vec2(sp, 0.));",
  "  float soft = (T(q + o + vec2(.0012, 0.)) + T(q + o - vec2(.0012, 0.)) + g) / 3.;",
  "  vec3 txt = vec3(r * .95, soft, b) * vec3(.96, .97, 1.);",
  "  float glow = G(q + o, .006) * .9 + G(q + o, .016) * .6;",
  "  float scan = .82 + .18 * sin(q.y * res.y * 1.6);",
  "  float grain = (h(q * res + t * 61.) - .5) * .18;",
  "  vec3 c = B(q + o * .25);",
  "  float a = max(max(r, g), b);",
  "  c = mix(c, txt * scan + grain * a, a * e);",
  "  c += vec3(.35, .45, 1.) * glow * .55 * e;",
  "  c += band * .03 * vec3(h(q * 400. + t));",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Глитч", font: "Neue Machina", note: "Цифровой сбой: реплика рвётся на горизонтальные полосы, куски уезжают вбок с RGB-сдвигом, мелькают блоки. Между сбоями текст стоит ровно.",
  type: "500 30px 'Neue Machina'", spacing: 1, color: "#FFFFFF", y: .86,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  float burst = step(.82, n(vec2(floor(t * 9.), 3.))) + (1. - e) * 1.5;",
  "  float slice = floor(q.y * 46.);",
  "  float sh = (h(vec2(slice, floor(t * 18.))) - .5) * .09 * burst * step(.55, h(vec2(slice * 1.7, floor(t * 11.))));",
  "  vec2 blk = floor(q * vec2(28., 18.));",
  "  float bx = step(.93, h(blk + floor(t * 13.))) * burst;",
  "  vec2 o = vec2(sh + bx * .03, 0.);",
  "  float r = T(q + o + vec2(.006 * burst, 0.)), g = T(q + o), b = T(q + o - vec2(.008 * burst, .002 * burst));",
  "  vec3 txt = vec3(r, g, b);",
  "  vec3 c = B(q);",
  "  float a = max(max(r, g), b) * min(1., e * 3.);",
  "  c = mix(c, txt + vec3(0., .05, .1) * bx, a);",
  "  c += vec3(.0, .9, 1.) * bx * T(q + vec2(.02, 0.)) * .5;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Плёнка", font: "Futura New", note: "Текст впечатан в плёнку: зерно внутри букв, красно-оранжевый ореол (halation), лёгкое дрожание кадра в фильмовом окне, мерцание яркости. Проявляется как при печати.",
  type: "500 31px 'Futura New'", spacing: 2, color: "#FFF1DE", y: .86,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  vec2 weave = vec2(n(vec2(t * 3., 1.)) - .5, n(vec2(t * 2.3, 7.)) - .5) * .0025;",
  "  float m = T(q + weave);",
  "  float hal = G(q + weave, .004) * .8 + G(q + weave, .012) * .7 + G(q + weave, .028) * .45;",
  "  float grain = h(floor(q * res * .9) + floor(t * 24.)) - .5;",
  "  float flick = .93 + .07 * n(vec2(t * 16., 2.));",
  "  vec3 ink = vec3(1., .95, .87) * (1. + grain * .35) * flick;",
  "  float dev = smoothstep(0., 1., e * 1.4 - fbm(q * 9.) * .4);",
  "  vec3 c = B(q);",
  "  c = mix(c, ink, m * dev);",
  "  c += vec3(1., .32, .12) * hal * .75 * dev;",
  "  c += (h(q * res + t) - .5) * .045;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Анаморф", font: "Inter Display", note: "Кинематографичный блик: сильное послесвечение и длинные синие горизонтальные лучи от букв, как от анаморфотной линзы. Реплика выплывает из размытия.",
  type: "300 32px 'Inter Display'", spacing: 5, color: "#FFFFFF", y: .86,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  float blur = (1. - e) * .012;",
  "  float m = blur > .0005 ? G(q, blur) * 1.6 : T(q);",
  "  float streak = 0.;",
  "  for (int i = 1; i <= 24; i++) { float d = float(i) * .011; streak += (T(q + vec2(d, 0.)) + T(q - vec2(d, 0.))) * (1. - float(i) / 25.); }",
  "  streak /= 24.;",
  "  float bloom = G(q, .007) * .9 + G(q, .02) * .6;",
  "  vec3 c = B(q);",
  "  c = mix(c, vec3(1.), clamp(m, 0., 1.) * e);",
  "  c += vec3(.25, .5, 1.) * streak * 1.4 * e + vec3(.6, .7, 1.) * bloom * .6 * e;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Жидкость", font: "Cormorant", note: "Текст как отражение в воде: буквы медленно колышутся волнами шума, по краям мягкое свечение, внизу дрожащее отражение. Появляется, «всплывая» из ряби.",
  type: "italic 600 38px Cormorant", spacing: 1, color: "#F3E8D4", y: .8,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  float amp = .0035 + (1. - e) * .03;",
  "  vec2 d = vec2(fbm(q * 7. + vec2(t * .35, 0.)) - .5, fbm(q * 7. + vec2(0., t * .3) + 5.) - .5) * amp * 2.;",
  "  float m = T(q + d);",
  "  float glow = G(q + d, .01);",
  "  vec2 rq = vec2(q.x, 2. * .88 - q.y);",
  "  rq += vec2(sin(q.y * 140. + t * 3.) * .004, 0.) + d * 2.;",
  "  float refl = T(rq) * smoothstep(.98, .89, q.y) * step(.88, q.y) * .35;",
  "  vec3 c = B(q);",
  "  vec3 ink = vec3(.953, .91, .83);",
  "  c = mix(c, ink, m * e);",
  "  c += ink * refl * e + vec3(1., .85, .6) * glow * .35 * e;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Неон", font: "Neue Machina", note: "Настоящий неон: белая сердцевина, розовый ореол в три слоя, гул трубки (мелкое мерцание) и отсвет на воде. Загорается с перебоями.",
  type: "500 30px 'Neue Machina'", spacing: 2, color: "#FFFFFF", y: .84,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  float on = e < 1. ? step(.35, n(vec2(t * 30., 1.))) * e : 1.;",
  "  float hum = .9 + .1 * sin(t * 120.) * n(vec2(t * 5., 4.));",
  "  float m = T(q);",
  "  float g1 = G(q, .004), g2 = G(q, .012), g3 = G(q, .03);",
  "  vec3 pink = vec3(1., .2, .75);",
  "  vec3 c = B(q);",
  "  vec2 rq = vec2(q.x + sin(q.y * 200. + t * 4.) * .003, 2. * .9 - q.y);",
  "  float refl = G(rq, .01) * step(.9, q.y);",
  "  c = mix(c, vec3(1., .93, .98), m * on * hum);",
  "  c += pink * (g1 * 1.2 + g2 * .9 + g3 * .6) * on * hum + pink * refl * .5 * on;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Пепел", font: "GT America Trial Rg", note: "Реплика сгорает и собирается из пепла: край букв тлеет оранжевым, частицы уносит вверх. Появление и исчезновение по шумовой маске.",
  type: "400 30px 'GT America Trial Rg', 'Akzidenz-Grotesk Pro'", spacing: 1, color: "#FFFFFF", y: .86,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  float out_ = smoothstep(.83, 1., k / 6.);",
  "  float thr = e - out_;",
  "  float nz = fbm(q * vec2(18., 9.));",
  "  float m = T(q);",
  "  float edge = smoothstep(.0, .08, thr - nz) ;",
  "  float rim = (1. - edge) * smoothstep(-.06, 0., thr - nz) * G(q, .002) * 2.;",
  "  vec2 up = q + vec2((n(vec2(q.x * 30., t)) - .5) * .01, (1. - edge) * .03 + t * .0);",
  "  float ash = T(up + vec2(0., .02 * (1. - edge))) * step(.75, h(floor(q * res * .5) + floor(t * 20.))) * (1. - edge) * .8;",
  "  vec3 c = B(q);",
  "  c = mix(c, vec3(.97), m * edge);",
  "  c += vec3(1., .45, .1) * rim * 1.6 + vec3(1., .6, .25) * ash * .6;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
},
{
  name: "Титры", font: "Akzidenz-Grotesk Pro", note: "Второй референс, впечатанный в кадр: мелкий лаймовый гротеск с плёночным зерном, едва заметным ореолом и дрожанием фильмового окна.",
  type: "400 21px 'Akzidenz-Grotesk Pro'", spacing: .3, color: "#DAF45E", y: .88,
  fs: [
  "void main() {",
  "  vec2 q = uv; float e = E();",
  "  vec2 weave = vec2(n(vec2(t * 2., 3.)) - .5, n(vec2(t * 1.7, 9.)) - .5) * .0015;",
  "  float m = T(q + weave);",
  "  float glow = G(q + weave, .004);",
  "  float grain = h(floor(q * res) + floor(t * 24.)) - .5;",
  "  vec3 lime = vec3(.855, .957, .369) * (1. + grain * .3);",
  "  vec3 c = B(q);",
  "  c = mix(c, lime, m * smoothstep(0., 1., e * 1.3));",
  "  c += vec3(.75, .95, .3) * glow * .22 * e;",
  "  c += (h(q * res + t) - .5) * .04;",
  "  gl_FragColor = vec4(c, 1.);",
  "}"].join("\n")
}];

function textCanvas(s) {
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var x = c.getContext("2d");
  // Sizes are for a 360-line frame; .72 brings the line height near the BBC's 7-8% of the picture.
  var px = parseFloat(s.type.match(/(\d+)px/)[1]) * (H / 360) * .72;
  x.font = s.type.replace(/\d+px/, px + "px");
  if ("letterSpacing" in x) x.letterSpacing = (s.spacing * H / 360) + "px";
  x.textAlign = "center";
  x.textBaseline = "alphabetic";
  x.fillStyle = "#fff";
  var lh = px * 1.38;
  var y0 = H * s.y - lh * (LINES.length - 1);
  LINES.forEach(function (l, i) { x.fillText(l, W / 2, y0 + i * lh); });
  return c;
}

function build(s) {
  var wrap = document.createElement("div");
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  wrap.appendChild(cv);
  var h3 = document.createElement("h3");
  h3.innerHTML = s.name + ' <span class="font">' + s.font + "</span>";
  var p = document.createElement("p");
  p.className = "fx";
  p.textContent = s.note;
  wrap.appendChild(h3);
  wrap.appendChild(p);
  document.getElementById("grid").appendChild(wrap);

  var gl = cv.getContext("webgl", { antialias: false, premultipliedAlpha: false });
  if (!gl) { p.innerHTML += ' <span class="err">WebGL недоступен.</span>'; return null; }
  function sh(type, src) {
    var o = gl.createShader(type);
    gl.shaderSource(o, src);
    gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { p.innerHTML += ' <span class="err">' + gl.getShaderInfoLog(o) + "</span>"; }
    return o;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, COMMON + s.fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  function tex(unit, source) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  }
  tex(0, img);
  tex(1, textCanvas(s));
  gl.uniform1i(gl.getUniformLocation(prog, "bg"), 0);
  gl.uniform1i(gl.getUniformLocation(prog, "tx"), 1);
  gl.uniform2f(gl.getUniformLocation(prog, "res"), W, H);
  return { gl: gl, ut: gl.getUniformLocation(prog, "t"), uk: gl.getUniformLocation(prog, "k") };
}

img.onload = function () {
  var fonts = STYLES.map(function (s) { return document.fonts.load(s.type.replace(/\d+px/, "40px")).catch(function () {}); });
  Promise.all(fonts).then(function () {
    var views = STYLES.map(build);
    var start = performance.now();
    function frame(now) {
      var t = (now - start) / 1000;
      var k = t % 6;  // seconds since the cue appeared
      views.forEach(function (v) {
        if (!v) return;
        v.gl.uniform1f(v.ut, t);
        v.gl.uniform1f(v.uk, k);
        v.gl.drawArrays(v.gl.TRIANGLE_STRIP, 0, 4);
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
};
